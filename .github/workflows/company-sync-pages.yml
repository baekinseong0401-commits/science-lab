name: Company site - sync and deploy

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: company-sync-pages
  cancel-in-progress: false

jobs:
  sync:
    name: Sync original repository
    if: github.repository == 'baekinseong0401-commits/science-lab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    outputs:
      sha: ${{ steps.sync.outputs.sha }}
      deploy: ${{ steps.sync.outputs.deploy }}
    steps:
      - name: Safely merge upstream main
        id: sync
        uses: actions/github-script@v8
        with:
          script: |
            const target = { ...context.repo, branch: 'main' };
            const repository = (await github.rest.repos.get(context.repo)).data;
            if (repository.parent?.full_name !== 'Petrick0255-create/science-lab') {
              throw new Error('Unexpected upstream repository; synchronization stopped.');
            }
            const before = (await github.rest.repos.getBranch(target)).data.commit.sha;
            let message = 'Company main updated directly.';
            if (context.eventName !== 'push') {
              try {
                const result = await github.rest.repos.mergeUpstream(target);
                message = result.data.message;
              } catch (error) {
                await core.summary
                  .addHeading('Automatic sync stopped')
                  .addRaw('No force overwrite was attempted. Resolve the upstream/company conflict or permission error, then run this workflow again.')
                  .write();
                throw error;
              }
            }
            const after = (await github.rest.repos.getBranch(target)).data.commit.sha;
            let retryDeployment = false;
            if (context.eventName === 'schedule' && before === after) {
              const previous = await github.rest.actions.listWorkflowRuns({
                ...context.repo,
                workflow_id: 'company-sync-pages.yml',
                branch: 'main',
                status: 'completed',
                per_page: 1
              });
              retryDeployment = previous.data.workflow_runs[0]?.conclusion !== 'success';
            }
            const deploy = context.eventName !== 'schedule' || before !== after || retryDeployment;
            core.setOutput('sha', after);
            core.setOutput('deploy', String(deploy));
            await core.summary
              .addHeading('Company site synchronization')
              .addTable([
                [{ data: 'Setting', header: true }, { data: 'Value', header: true }],
                ['Source', 'Petrick0255-create/science-lab:main'],
                ['Destination', 'baekinseong0401-commits/science-lab:main'],
                ['Check interval', 'Every 30 minutes (GitHub may delay scheduled runs)'],
                ['Result', message],
                ['Company commit', after],
                ['Publish site', deploy ? 'Yes' : 'No changes; existing site kept'],
                ['Conflict handling', 'Stop without force overwrite']
              ])
              .write();

  build:
    name: Build company website
    needs: sync
    if: needs.sync.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out synchronized company version
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.sha }}
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build with the existing Pages format
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
          retention-days: 1

  deploy:
    name: Publish company website
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
